<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拾光旅行 · AI 旅行规划</title>
<style>
  :root{
    --bg:#f6f5f1; --card:#ffffff; --ink:#1f2329; --sub:#6b7280; --line:#e8e5de;
    --accent:#2f6fed; --accent-soft:#eef3fd; --gold:#c8a04a;
    --radius:14px;
    --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.65; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px;margin:0 auto;padding:40px 20px 72px;}
  header{text-align:center;margin-bottom:32px;}
  .logo{display:inline-flex;align-items:center;gap:8px;font-size:28px;font-weight:700;letter-spacing:.5px;}
  .logo .ico{font-size:30px;}
  .tagline{color:var(--sub);font-size:14px;margin-top:8px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px 30px;box-shadow:var(--shadow);margin-bottom:20px;}
  h2{font-size:17px;font-weight:700;margin-bottom:18px;display:flex;align-items:center;gap:8px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .field{display:flex;flex-direction:column;}
  .field.full{grid-column:1 / -1;}
  .field label{font-size:13px;font-weight:600;color:#374151;margin-bottom:6px;}
  .field label .req{color:#c0392b;margin-left:2px;}
  .field input,.field select,.field textarea{
    border:1px solid #d3dbe6;border-radius:9px;padding:10px 12px;font-size:14px;font-family:inherit;
    color:var(--ink);background:#fbfcfe;outline:none;transition:border-color .15s,box-shadow .15s;
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,109,237,.12);background:#fff;}
  .field textarea{resize:vertical;min-height:72px;}
  .chip-group{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    border:1px solid #d3dbe6;background:#fff;color:#5b6470;border-radius:999px;
    padding:6px 14px;font-size:13px;cursor:pointer;transition:all .15s;user-select:none;
  }
  .chip:hover{border-color:#b9c6d6;}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border:none;cursor:pointer;border-radius:10px;font-size:15px;font-weight:600;
    padding:12px 28px;transition:all .15s;
  }
  .btn-primary{background:var(--accent);color:#fff;width:100%;}
  .btn-primary:hover{background:#2457c8;}
  .btn-primary:disabled{background:#a8bde8;cursor:not-allowed;}
  /* 结果区 */
  .result-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .result-head .title{font-size:17px;font-weight:700;}
  .result-head .meta{font-size:12.5px;color:var(--sub);}
  .loading{display:none;text-align:center;padding:40px 0;}
  .loading.show{display:block;}
  .spinner{width:34px;height:34px;border:3px solid #e5e7eb;border-top-color:var(--accent);border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading p{color:var(--sub);font-size:14px;}
  .day-block{background:#fafaf8;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px;}
  .day-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .day-num{background:var(--accent);color:#fff;font-size:13px;font-weight:700;padding:3px 10px;border-radius:7px;}
  .day-theme{font-weight:600;font-size:15px;}
  .spot{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed #eeeae0;}
  .spot:last-child{border-bottom:none;}
  .spot-time{color:var(--accent);font-weight:600;font-size:13px;min-width:52px;white-space:nowrap;}
  .spot-name{font-weight:600;font-size:14px;}
  .spot-desc{font-size:13px;color:var(--sub);margin-top:2px;}
  .spot-tag{font-size:11px;color:var(--gold);background:#faf3e3;border-radius:5px;padding:1px 7px;margin-left:6px;font-weight:600;}
  .spot-miss{font-size:11px;color:#b91c1c;background:#fee2e2;border-radius:5px;padding:1px 6px;margin-left:6px;font-weight:600;}
  .budget-bar{background:var(--accent-soft);border:1px solid #dbe6fb;border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13.5px;color:#374151;}
  .budget-bar b{color:var(--accent);}
  .empty-state{text-align:center;padding:50px 20px;color:#9aa1ab;}
  .empty-state .big{font-size:44px;margin-bottom:12px;}
  .error-box{background:#fdf3f2;border:1px solid #f5c6c0;color:#b9382c;border-radius:10px;padding:14px 18px;font-size:14px;margin-bottom:16px;display:none;}
  .error-box.show{display:block;}
  .footnote{text-align:center;color:#9aa1ab;font-size:12.5px;margin-top:28px;line-height:1.8;}
  /* 双滑条 */
  .range-box{padding:4px 2px;}
  .range-track{position:relative;height:6px;background:#e3e8ef;border-radius:999px;margin:14px 6px 8px;cursor:pointer;}
  .range-fill{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:999px;}
  .range-thumb{position:absolute;top:50%;width:20px;height:20px;background:#fff;border:2px solid var(--accent);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 1px 3px rgba(0,0,0,.15);cursor:grab;touch-action:none;}
  .range-thumb:active{cursor:grabbing;}
  .range-val{font-size:14px;font-weight:600;color:var(--accent);}
  .range-hint{font-size:12px;color:#9aa1ab;margin-top:2px;}
  /* 数字拨盘（stepper） */
  .stepper{display:flex;align-items:center;gap:6px;}
  .step-btn{
    width:38px;height:38px;border:1px solid #d3dbe6;background:#fff;color:#374151;
    font-size:20px;line-height:1;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:all .15s;user-select:none;flex-shrink:0;
  }
  .step-btn:hover{border-color:var(--accent);color:var(--accent);}
  .step-btn:active{background:var(--accent-soft);}
  .stepper input[type=number]{
    width:64px;height:38px;text-align:center;font-size:16px;font-weight:600;
    border:1px solid #d3dbe6;border-radius:9px;background:#fbfcfe;color:var(--ink);outline:none;
    -moz-appearance:textfield;
  }
  .stepper input[type=number]::-webkit-outer-spin-button,
  .stepper input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .stepper input[type=number]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,109,237,.12);background:#fff;}
  .step-unit{font-size:14px;color:#5b6470;font-weight:600;}
  /* 酒店推荐 */
  .hotel-wrap{margin-top:6px;}
  .hotel-head{font-size:15px;font-weight:700;margin:18px 0 10px;display:flex;align-items:center;gap:6px;}
  .hotel-card{background:#f7fbf7;border:1px solid #dceadc;border-radius:11px;padding:12px 16px;margin-bottom:10px;}
  .hotel-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .hotel-idx{background:#3f9d5b;color:#fff;font-size:12px;font-weight:700;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
  .hotel-area{font-weight:700;font-size:14.5px;}
  .hotel-price{font-size:12.5px;font-weight:600;color:#2e7d46;background:#e6f4ea;border-radius:6px;padding:2px 8px;}
  .hotel-reason{font-size:13px;color:#4b5563;margin-top:6px;}
  .hotel-tip{font-size:12.5px;color:#8a94a3;margin-top:4px;}
  .otel-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .otel-intl{margin-top:6px;padding-top:8px;border-top:1px dashed #e2e8f0;}
  .otel-btn{display:inline-flex;align-items:center;font-size:12px;font-weight:600;color:var(--accent);background:#fff;border:1px solid #c9d9f2;border-radius:7px;padding:4px 11px;text-decoration:none;transition:all .15s;}
  .otel-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
  .map-wrap{margin-top:12px;border:1px solid var(--line);border-radius:11px;overflow:hidden;}
  .map-head{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#374151;padding:9px 14px;background:#f7f9fc;border-bottom:1px solid var(--line);}
  .map-box{width:100%;height:260px;background:#eef1f5;}
  .map-hint{font-size:12px;color:#9aa1ab;padding:8px 14px;background:#fff;border-top:1px dashed var(--line);}
  @media(max-width:640px){
    .form-grid{grid-template-columns:1fr;}
    .field.full{grid-column:1;}
    .card{padding:22px 18px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><span class="ico">🧭</span>拾光旅行</div>
    <div class="tagline">输入你的旅行愿望，AI 帮你规划一份专属行程</div>
  </header>

  <!-- 输入区 -->
  <div class="card">
    <h2>✈️ 告诉我你的旅行</h2>
    <div class="form-grid">
      <div class="field">
        <label>目的地<span class="req">*</span></label>
        <input id="dest" placeholder="如：成都、西安、大理…">
      </div>
      <div class="field">
        <label>出行天数<span class="req">*</span></label>
        <div class="stepper">
          <button type="button" class="step-btn" id="days-minus">−</button>
          <input type="number" id="days-input" min="1" max="30" value="4" inputmode="numeric">
          <button type="button" class="step-btn" id="days-plus">+</button>
          <span class="step-unit">天</span>
        </div>
      </div>
      <div class="field">
        <label>旅行人数</label>
        <div class="stepper">
          <button type="button" class="step-btn" id="people-minus">−</button>
          <input type="number" id="people-input" min="1" max="20" value="1" inputmode="numeric">
          <button type="button" class="step-btn" id="people-plus">+</button>
          <span class="step-unit">人</span>
        </div>
      </div>
      <div class="field">
        <label>人均预算（元）</label>
        <div class="range-box">
          <div class="range-track" id="budget-track">
            <div class="range-fill" id="budget-fill"></div>
            <div class="range-thumb" id="budget-thumb-min"></div>
            <div class="range-thumb" id="budget-thumb-max"></div>
          </div>
          <div class="range-val" id="budget-val"></div>
        </div>
        <div class="range-hint">一个人为这趟旅行准备的钱（含机票/车票 + 酒店 + 吃喝玩乐）· 两端可重合表示固定金额</div>
      </div>
      <div class="field">
        <label>往返大交通（元/人，可选）</label>
        <input type="number" id="flight-cost" min="0" placeholder="如 1200，留空则 AI 帮你估" inputmode="numeric">
      </div>
      <div class="field">
        <label>住宿预算（元/人，可选）</label>
        <input type="number" id="hotel-cost" min="0" placeholder="如 800，留空则 AI 帮你估" inputmode="numeric">
      </div>
      <div class="field">
        <label>出行方式</label>
        <select id="transport">
          <option value="公共交通">公共交通</option>
          <option value="自驾">自驾</option>
          <option value="租车">租车</option>
          <option value="打车为主">打车为主</option>
        </select>
      </div>
      <div class="field full">
        <label>行程节奏</label>
        <div class="chip-group" id="pace-group">
          <span class="chip on" data-v="紧凑高效">紧凑高效（特种兵式，打卡点多）</span>
          <span class="chip" data-v="轻松慢游">轻松慢游（随心逛，留足休息）</span>
        </div>
      </div>
      <div class="field full">
        <label>旅行偏好（可多选）</label>
        <div class="chip-group" id="pref-group">
          <span class="chip on" data-v="美食">美食</span>
          <span class="chip on" data-v="人文历史">人文历史</span>
          <span class="chip" data-v="自然风光">自然风光</span>
          <span class="chip" data-v="网红打卡">网红打卡</span>
          <span class="chip" data-v="亲子休闲">亲子休闲</span>
          <span class="chip" data-v="购物">购物</span>
          <span class="chip" data-v="摄影">摄影</span>
          <span class="chip" data-v="小众深度">小众深度</span>
        </div>
      </div>
      <div class="field full">
        <label>小红书攻略（可选）</label>
        <textarea id="xiaohongshu" placeholder="两种用法任选：① 直接贴小红书链接（可贴多条，换行分隔）；② 把攻略要点摘进来，如：网红餐厅要早排队、某景点周六闭馆、本地人推荐的苍蝇馆子…。AI 会自动去广告、提炼真实玩法。" style="min-height:64px;"></textarea>
      </div>
      <div class="field full">
        <label>补充说明（可选）</label>
        <textarea id="extra" placeholder="如：带老人、想看夜景、不吃辣、第一天下午才到…"></textarea>
      </div>
    </div>
    <button class="btn btn-primary" id="gen-btn" style="margin-top:20px;">✨ 生成我的行程</button>
  </div>

  <!-- 结果区 -->
  <div class="card" id="result-card" style="display:none;">
    <div class="result-head">
      <div class="title">🗺️ 你的专属行程</div>
      <div class="meta" id="result-meta"></div>
    </div>
    <div class="error-box" id="error-box"></div>
    <div class="budget-bar" id="budget-bar" style="display:none;"></div>
    <div id="adjust-box" style="display:none;">
      <div style="display:flex;gap:8px;margin-bottom:16px;">
        <input id="adjust-input" placeholder="对这份攻略提要求，如：第二天换成公园、删掉第三天、加一个看夜景、预算再省点…" style="flex:1;border:1px solid #d3dbe6;border-radius:9px;padding:10px 12px;font-size:14px;font-family:inherit;color:var(--ink);background:#fbfcfe;outline:none;">
        <button class="btn btn-primary" id="adjust-btn" style="width:auto;padding:0 18px;white-space:nowrap;">调整攻略</button>
      </div>
    </div>
    <div id="result-body"></div>
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p id="loading-text">AI 正在为你规划行程，请稍候…</p>
    </div>
  </div>

  <div class="footnote">
    行程由 AI 生成，仅供参考，出行前请以实际交通与景点开放情况为准<br>
    拾光旅行 · 个人项目作品
  </div>
</div>

<script src="sdk.js"></script>
<script>
(function(){
  'use strict';
  // 云服务配置（从 publicConfig 注入）
  var PUBLIC_CONFIG = {
    endpoint: 'https://ai-trip-planner-71847.app.workbuddy.host',
    oauthRelayBaseUrl: 'https://www.workbuddy.cn/v2/as/genie-baas/oauth',
    publishableKey: 'wbpk_Clyial121TrkWNpX7oTP82_OuRc162Qka2KAruV8zD1qpzAgZaqQ6CD'
  };

  // 高德地图 Key（两个用途分开）：
  // AMAP_JS_KEY —— 地图显示（Web端 JS API）
  // AMAP_REST_KEY —— 坐标检索（Web服务 REST 接口）
  var AMAP_JS_KEY = 'd42db26868fcfa6214ac6ccea3dbaf29';
  var AMAP_REST_KEY = '545dfc05e2dcfa9ef96cee58bfe05178';
  var AMAP_KEY = AMAP_JS_KEY;   // 地图 SDK 加载用 JS key

  var cloud = null;
  var modelId = null;

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // 初始化 SDK
  function initCloud(){
    if(window.WorkBuddyCloud && window.WorkBuddyCloud.createWorkBuddyCloud){
      cloud = window.WorkBuddyCloud.createWorkBuddyCloud({
        endpoint: PUBLIC_CONFIG.endpoint,
        oauthRelayBaseUrl: PUBLIC_CONFIG.oauthRelayBaseUrl,
        publishableKey: PUBLIC_CONFIG.publishableKey
      });
      return true;
    }
    return false;
  }

  // 加载模型列表，选第一个可用模型
  async function loadModel(){
    try{
      var models = await cloud.llm.models.list();
      // 优先选快模型：非 disabled，且优先排除纯推理模型（推理模型通常很慢）
      var cands = models.filter(function(x){ return x.disabled !== true; });
      var m = cands.find(function(x){ return x.supportsReasoning !== true && x.onlyReasoning !== true; }) || cands[0];
      if(m){ modelId = m.id; return true; }
      return false;
    }catch(e){
      console.error('模型列表加载失败', e);
      return false;
    }
  }

  // 偏好 chip 交互
  var prefGroup = document.getElementById('pref-group');
  prefGroup.addEventListener('click', function(e){
    var chip = e.target.closest('.chip');
    if(!chip) return;
    chip.classList.toggle('on');
  });

  // 行程节奏 chip（单选互斥）
  var paceGroup = document.getElementById('pace-group');
  paceGroup.addEventListener('click', function(e){
    var chip = e.target.closest('.chip');
    if(!chip) return;
    var wasOn = chip.classList.contains('on');
    paceGroup.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('on'); });
    if(!wasOn){ chip.classList.add('on'); }
  });
  function getPace(){
    var on = paceGroup.querySelector('.chip.on');
    return on ? on.getAttribute('data-v') : '紧凑高效';
  }

  function getPrefs(){
    var arr = [];
    prefGroup.querySelectorAll('.chip.on').forEach(function(c){ arr.push(c.getAttribute('data-v')); });
    return arr;
  }

  // ===== 双滑条（天数 & 预算）=====
  function makeRange(cfg){
    var track = document.getElementById(cfg.track);
    var fill = document.getElementById(cfg.fill);
    var thumbMin = document.getElementById(cfg.thumbMin);
    var thumbMax = document.getElementById(cfg.thumbMax);
    var valEl = document.getElementById(cfg.valEl);
    var state = { min: cfg.min, max: cfg.max, vmin: cfg.initMin, vmax: cfg.initMax };

    function pct(v){ return ((v - cfg.min) / (cfg.max - cfg.min)) * 100; }

    function render(){
      var p1 = pct(state.vmin), p2 = pct(state.vmax);
      fill.style.left = p1 + '%';
      fill.style.width = (p2 - p1) + '%';
      thumbMin.style.left = p1 + '%';
      thumbMax.style.left = p2 + '%';
      if(cfg.format){
        valEl.textContent = cfg.format(state.vmin, state.vmax);
      } else {
        valEl.textContent = state.vmin + ' ~ ' + state.vmax;
      }
    }

    function setFromPos(clientX, which){
      var rect = track.getBoundingClientRect();
      var ratio = (clientX - rect.left) / rect.width;
      ratio = Math.max(0, Math.min(1, ratio));
      var v = Math.round(cfg.min + ratio * (cfg.max - cfg.min));
      if(cfg.step){ v = Math.round(v / cfg.step) * cfg.step; }
      v = Math.max(cfg.min, Math.min(cfg.max, v));
      if(which === 'min'){
        state.vmin = Math.min(v, state.vmax - cfg.gap);
      } else {
        state.vmax = Math.max(v, state.vmin + cfg.gap);
      }
      render();
    }

    function drag(which, e){
      e.preventDefault();
      var move = function(ev){
        var cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
        setFromPos(cx, which);
      };
      var up = function(){ document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); document.removeEventListener('touchmove', move); document.removeEventListener('touchend', up); };
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
      document.addEventListener('touchmove', move);
      document.addEventListener('touchend', up);
    }

    thumbMin.addEventListener('mousedown', function(e){ drag('min', e); });
    thumbMax.addEventListener('mousedown', function(e){ drag('max', e); });
    thumbMin.addEventListener('touchstart', function(e){ drag('min', e); }, {passive:false});
    thumbMax.addEventListener('touchstart', function(e){ drag('max', e); }, {passive:false});

    track.addEventListener('mousedown', function(e){
      if(e.target === thumbMin || e.target === thumbMax) return;
      // 点击轨道：往最近的端点靠
      var rect = track.getBoundingClientRect();
      var ratio = (e.clientX - rect.left) / rect.width;
      var p1 = pct(state.vmin)/100, p2 = pct(state.vmax)/100;
      var which = (Math.abs(ratio - p1) < Math.abs(ratio - p2)) ? 'min' : 'max';
      setFromPos(e.clientX, which);
    });

    render();
    return state;
  }

  // 天数拨盘
  var daysInput = document.getElementById('days-input');
  var daysMinus = document.getElementById('days-minus');
  var daysPlus = document.getElementById('days-plus');
  function getDays(){
    var v = parseInt(daysInput.value, 10);
    if(isNaN(v) || v < 1) v = 1;
    if(v > 30) v = 30;
    daysInput.value = v;
    return v;
  }
  daysMinus.addEventListener('click', function(){

  // ===== 坐标定位：用高德 REST 检索真实坐标 =====
  // AI 直接背坐标不可靠（会飘到海里）。这里逐点用高德地名检索取真实 GCJ-02 坐标。
  // 查不到返回 null（由调用方标记为未定位），绝不回退到 AI 坐标。
  async function geocodePoi(name, city){
    try{
      var url = 'https://restapi.amap.com/v3/place/text?keywords=' + encodeURIComponent(name) +
        '&city=' + encodeURIComponent(city) + '&citylimit=false&key=' + AMAP_REST_KEY + '&offset=5&page=1';
      var r = await fetch(url);
      var j = await r.json();
      if(j.status === '1' && j.pois && j.pois.length){
        for(var i=0;i<j.pois.length;i++){
          var loc = j.pois[i] && j.pois[i].location ? j.pois[i].location.split(',') : null;
          if(loc){
            var lng = parseFloat(loc[0]), lat = parseFloat(loc[1]);
            if(!isNaN(lng) && !isNaN(lat)) return { lng: lng, lat: lat };
          }
        }
      }
    }catch(e){ /* 检索失败 */ }
    return null;
  }

  async function fixPlanCoords(data, dest){
    if(!AMAP_REST_KEY || !dest) return;
    // 坐标只信高德；AI 给的 lng/lat 先全部清空
    var jobs = [];
    (data.days || []).forEach(function(d){
      (d.spots || []).forEach(function(sp){
        if(!sp) return;
        sp.lng = null; sp.lat = null; sp._located = false;
        var isHotel = /酒店|住宿|客栈|民宿|青旅|宾馆/.test(sp.name || '');
        if(isHotel){ sp._isHotel = true; return; }   // 酒店点不标坐标、不进地图
        jobs.push({ sp: sp, keyword: sp.name || '' });
      });
    });
    // 逐个串行检索，避免并发过多触发限流
    for(var i=0;i<jobs.length;i++){
      var j = jobs[i];
      var loc = await geocodePoi(j.keyword, dest);
      if(loc){
        j.sp.lng = loc.lng;
        j.sp.lat = loc.lat;
        j.sp._located = true;
      }
    }
  }

  async function renderResult(raw, dest, days){

      showError('AI 返回内容解析失败，请重新生成');

      showError('AI 返回的行程为空，请重新生成');
      return;

    // 用高德 POI 检索校准坐标（AI 给的经纬度不准，以高德为准）
    await fixPlanCoords(data, dest);

    // 保存当前行程，供二次调整使用

    var adjustBox = document.getElementById('adjust-box');

        ];
        var intl = [
          {n:'Booking', u:'https://www.booking.com/searchresults.html?ss=' + kw},

  // 高德地图：加载 SDK（动态注入，避免阻塞首屏）
  var amapReady = false;
  var amapLoading = false;
  function loadAmap(cb){
    if(!AMAP_KEY){ return; }
    if(amapReady){ cb && cb(); return; }
    if(amapLoading){ setTimeout(function(){ loadAmap(cb); }, 200); return; }
    amapLoading = true;
    var s = document.createElement('script');
    s.src = 'https://webapi.amap.com/maps?v=2.0&key=' + AMAP_KEY;
    s.onload = function(){ amapReady = true; amapLoading = false; cb && cb(); };
    s.onerror = function(){ amapLoading = false; };
    document.head.appendChild(s);
  }

  // 画某一天的路线图（只画高德已定位的点）
  function renderDayMap(d, dest){
    if(!AMAP_KEY){ return; }
    loadAmap(function(){
      try{
        var spots = (d.spots || []).filter(function(sp){ return sp && sp._located === true && (sp.lng != null) && (sp.lat != null); });
        if(spots.length < 2) return;
        var box = document.getElementById('map-' + d.day);
        if(!box) return;
        var map = new AMap.Map(box, { zoom: 12, resizeEnable: true });
        var path = spots.map(function(sp){ return [sp.lng, sp.lat]; });
        var points = path.map(function(p, i){
          return new AMap.Marker({ position: p, content: '<div style="background:#2f6fed;color:#fff;border-radius:50%;width:20px;height:20px;line-height:20px;text-align:center;font-size:11px;font-weight:700;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3);">' + (i+1) + '</div>', offset: new AMap.Pixel(-10,-10) });
        });
        map.add(points);
        var line = new AMap.Polyline({ path: path, strokeColor: '#2f6fed', strokeWeight: 4, strokeOpacity: 0.9, strokeStyle: 'solid', showDir: true });
        map.add(line);
        map.setFitView(null, false, [80, 80, 80, 80]);
        var hint = document.getElementById('map-hint-' + d.day);
        if(hint){
          var names = spots.map(function(sp){ return sp.name; }).join(' → ');
          hint.textContent = '路线顺序：' + names;
        }
      }catch(e){ console.error('地图渲染失败', e); }
    });
  }

  function showError(msg){
    resultCard.style.display = 'block';
    errorBox.classList.add('show');
    errorBox.textContent = msg;
    loading.classList.remove('show');
    genBtn.disabled = false;
  }

  // 页面加载时预初始化
  (function boot(){
    if(initCloud()){ loadModel(); }
  })();
})();
</script>
</body>
</html>
